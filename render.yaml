services:
  - type: web
    name: orbitschool
    runtime: node
    plan: starter
    buildCommand: "echo no build needed"
    startCommand: "node orbit-server.js"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_FILE
        value: /var/data/orbit-data.json
    disk:
      name: orbit-data
      mountPath: /var/data
      sizeGB: 1
